# Wrangler config — LOCAL DEVELOPMENT ONLY.
#
# Cloudflare Pages deployment is configured entirely in the PAGES DASHBOARD:
#   • Build command:        npm run pages:build
#   • Build output dir:     .vercel/output/static
#   • D1 binding:           Variable name "DB" -> your supermart-crm database
#   • Compatibility flags:  nodejs_compat   (Production AND Preview)
#
# This file deliberately OMITS `pages_build_output_dir` so the Pages Git build
# ignores it and uses the dashboard settings above. (If it were present, Pages
# would try to bind the placeholder D1 id below and the deploy would fail.)

name = "supermarket-crm"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Local D1 binding for `wrangler pages dev` / `wrangler d1 execute --local`.
[[d1_databases]]
binding = "DB"
database_name = "supermart-crm"
database_id = "local"
